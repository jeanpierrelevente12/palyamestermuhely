<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saját oldalam</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("hatter.jpg") no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
}

/* MENÜ */
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
}

nav button {
    background: transparent;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    padding: 10px 15px;
    transition: 0.3s;
}

nav button:hover {
    background: white;
    color: black;
    border-radius: 8px;
}

/* SZEKCIÓK */
section {
    display: none;
    padding: 60px 20px;
    max-width: 900px;
    margin: auto;
}

section.active {
    display: block;
}

/* KÁRTYA */
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(8px);
    margin-bottom: 20px;
}
</style>
</head>

<body>
<div class="overlay">

<!-- MENÜ -->
<nav>
    <button onclick="show('home')">Főoldal</button>
    <button onclick="show('maps')">Térképek</button>
    <button onclick="show('images')">Képek</button>
</nav>

<!-- FŐOLDAL -->
<section id="home" class="active">
    <div class="card">
        <h1>Üdv az oldalamon 👋</h1>
        <p>Ez egy modern GitHub Pages weboldal.</p>
    </div>
</section>

<!-- TÉRKÉPEK -->
<section id="maps">
    <div class="card">
        <h2>Térképek</h2>
        <p>Válassz egy térképet:</p>

        <button onclick="openPDF()" style="
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: black;
            font-size: 14px;
        ">
            ETCS térkép
        </button>
    </div>

    <div class="card" id="pdfBox" style="display:none;">
        <iframe 
            src="etcs.pdf"
            width="100%"
            height="600px"
            style="border:none; border-radius:10px;">
        </iframe>
    </div>
</section>

<!-- KÉPEK -->
<section id="images">
    <div class="card">
        <h2>Képek</h2>
        <p>Itt lesz a galéria.</p>
    </div>
</section>

<!-- JS -->
<script>
function show(id) {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function openPDF() {
    document.getElementById("pdfBox").style.display = "block";
}
</script>

</div>
</body>
</html>
