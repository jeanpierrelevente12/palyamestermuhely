<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saját oldalam</title>

<style>
/* ====== ALAP ====== */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url("20260405_173741.jpg") no-repeat center center fixed;
    background-size: cover;
}

/* sötét overlay, hogy olvasható legyen */
.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
}

/* ====== MENÜ ====== */
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    position: sticky;
    top: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
}

nav button {
    background: transparent;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    padding: 10px 15px;
    transition: 0.3s;
}

nav button:hover {
    background: white;
    color: black;
    border-radius: 8px;
}

/* ====== SZEKCIÓK ====== */
section {
    display: none;
    padding: 60px 20px;
    max-width: 900px;
    margin: auto;
}

section.active {
    display: block;
}

/* ====== MODERN HATÁS ====== */
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(8px);
}
</style>

</head>

<body>
<div class="overlay">

<nav>
    <button onclick="show('home')">Főoldal</button>
    <button onclick="show('maps')">Térképek</button>
    <button onclick="show('images')">Képek</button>
</nav>

<!-- HOME -->

<section id="home" class="active">
    <div class="card">
        <h1>Üdv az oldalamon 👋</h1>
        <p>Ez egy modern, egyszerű HTML alapú weboldal GitHub Pages-re.</p>
    </div>
</section>

<!-- TÉRKÉPEK -->

<section id="maps">
    <div class="card">
        <h2>Térképek</h2>
        <p>Itt lehet majd Google Maps vagy saját térképes tartalom.</p>
    </div>
</section>

<!-- KÉPEK -->

<section id="images">
    <div class="card">
        <h2>Képek</h2>
        <p>Itt lesz a galéria.</p>
    </div>
</section>

<script>
function show(id) {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
</script>

</div>
</body>
</html>
